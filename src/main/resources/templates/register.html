<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | RealEstate Portal</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 5px 25px #00000012;
        }

        h1 {
            color: #123456;
            margin-top: 0;
        }

        .subtitle {
            color: #667085;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 16px 0 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd3dc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #9cc7ed;
            border-color: #123456;
        }

        .btn {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #123456;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover { background: #1c527f; }

        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .error {
            color: #a12622;
            background: #fff0ef;
        }

        .links {
            text-align: center;
            margin-top: 20px;
            line-height: 1.8;
        }

        a { color: #123456; }

        .field-error {
            color: #a12622;
            font-size: 13px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Create Account</h1>
    <p class="subtitle">Join RealEstate Portal to get started.</p>

    <div class="message error"
         th:if="${errorMessage != null}"
         th:text="${errorMessage}"></div>

    <form th:action="@{/register}" th:object="${user}" method="post">

        <label for="name">Full Name</label>
        <input id="name" type="text" th:field="*{name}"
               placeholder="Enter your full name"
               maxlength="100" required>
        <div class="field-error"
             th:if="${#fields.hasErrors('name')}"
             th:errors="*{name}"></div>

        <label for="email">Email Address</label>
        <input id="email" type="email" th:field="*{email}"
               placeholder="Enter your email"
               maxlength="150" required>
        <div class="field-error"
             th:if="${#fields.hasErrors('email')}"
             th:errors="*{email}"></div>

        <label for="password">Password</label>
        <input id="password" type="password" th:field="*{password}"
               placeholder="Minimum 8 characters"
               minlength="8" required>
        <div class="field-error"
             th:if="${#fields.hasErrors('password')}"
             th:errors="*{password}"></div>

        <button class="btn" type="submit">Create Account</button>
    </form>

    <div class="links">
        Already have an account?
        <a th:href="@{/login}">Login</a>
        <br>
        <a th:href="@{/}">Back to Home</a>
    </div>
</div>

</body>
</html>
