<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Property Details | RealEstate</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        nav {
            background: #123456;
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        nav h2 {
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
        }

        .container {
            max-width: 1000px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .details-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px #ddd;
        }

        .property-image {
            width: 100%;
            height: 400px;
            object-fit: cover;
            display: block;
            background: #e7edf4;
        }

        .image-placeholder {
            height: 300px;
            display: grid;
            place-items: center;
            background: #e7edf4;
            color: #64748b;
        }

        .info {
            padding: 28px;
        }

        .tag {
            color: #237442;
            font-weight: bold;
        }

        .price {
            font-size: 28px;
            font-weight: bold;
            color: #123456;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 25px 0;
        }

        .feature {
            background: #f4f7fb;
            padding: 18px;
            border-radius: 8px;
        }

        .feature p {
            margin-bottom: 0;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 24px;
        }

        .btn {
            display: inline-block;
            background: #123456;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #1c527f;
        }

        .contact-btn {
            background: #198754;
        }

        .contact-btn:hover {
            background: #146c43;
        }

        .favorite-btn {
            background: #a12622;
        }

        .favorite-btn:hover {
            background: #7f1d1d;
        }

        .success-message {
            padding: 14px 16px;
            margin: 20px 0;
            border-radius: 7px;
            color: #237442;
            background: #e3f5e8;
        }

        footer {
            background: #123456;
            color: white;
            text-align: center;
            padding: 22px;
            margin-top: 35px;
        }

        @media (max-width: 600px) {
            nav {
                padding: 18px 5%;
            }

            .container {
                margin: 22px auto;
                padding: 0 12px;
            }

            .property-image {
                height: 240px;
            }

            .info {
                padding: 18px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<nav>
    <h2>RealEstate Portal</h2>

    <div class="nav-links">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/properties}">Properties</a>
        <a th:href="@{/favorites}">❤️ My Favorites</a>
    </div>
</nav>

<main class="container">

    <article class="details-card">

        <img class="property-image"
             th:if="${property.imageUrl != null and !#strings.isEmpty(property.imageUrl)}"
             th:src="${property.imageUrl}"
             th:alt="${property.title}">

        <div class="image-placeholder"
             th:if="${property.imageUrl == null or #strings.isEmpty(property.imageUrl)}">
            Property image unavailable
        </div>

        <div class="info">

            <span class="tag"
                  th:text="${property.status != null ? property.status : property.type}">
                FOR SALE
            </span>

            <h1 th:text="${property.title}">Property Title</h1>

            <p>
                📍 <span th:text="${property.location}">Location</span>
            </p>

            <p class="price">
                ₹<span th:text="${#numbers.formatDecimal(property.price, 1, 'COMMA', 0, 'POINT')}">0</span>
            </p>

            <div class="features">

                <div class="feature">
                    <strong>Bedrooms</strong>
                    <p th:text="${property.bedrooms}">0</p>
                </div>

                <div class="feature">
                    <strong>Bathrooms</strong>
                    <p th:text="${property.bathrooms}">0</p>
                </div>

                <div class="feature">
                    <strong>Property Type</strong>
                    <p th:text="${property.type}">House</p>
                </div>

            </div>

            <div class="success-message"
                 th:if="${successMessage != null}"
                 th:text="${successMessage}">
                Property added successfully.
            </div>

            <div class="actions">

                <a th:href="@{/}" class="btn">
                    Back to Home
                </a>

                <a th:href="@{/property/{id}/enquiry(id=${property.id})}"
                   class="btn contact-btn">
                    Contact Owner
                </a>

                <form th:action="@{/favorites/add/{id}(id=${property.id})}"
                      method="post"
                      style="margin: 0;">

                    <button type="submit" class="btn favorite-btn">
                        ❤️ Add to Favorites
                    </button>

                </form>

                <a th:href="@{/properties(location=${property.location})}"
                   class="btn">
                    Similar Properties
                </a>

            </div>

        </div>

    </article>

</main>

<footer>
    <h3>RealEstate Portal</h3>
    <p>Find a place you can call home.</p>
</footer>

</body>
</html>
