<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | RealEstate Portal</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 5px 25px #00000012;
        }

        h1 {
            color: #123456;
            margin-top: 0;
        }

        .subtitle {
            color: #667085;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 16px 0 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd3dc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #9cc7ed;
            border-color: #123456;
        }

        .btn {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #123456;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover { background: #1c527f; }

        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .success {
            color: #237442;
            background: #e3f5e8;
        }

        .error {
            color: #a12622;
            background: #fff0ef;
        }

        .links {
            text-align: center;
            margin-top: 20px;
            line-height: 1.8;
        }

        a { color: #123456; }
    </style>
</head>
<body>

<div class="card">
    <h1>Welcome Back</h1>
    <p class="subtitle">Login to your RealEstate account.</p>

    <div class="message success" th:if="${param.registered}">
        Registration successful! You can now log in.
    </div>

    <div class="message error" th:if="${param.error}">
        Invalid email or password. Please try again.
    </div>

    <div class="message success" th:if="${param.logout}">
        You have logged out successfully.
    </div>

    <form th:action="@{/login}" method="post">

        <label for="username">Email Address</label>
        <input id="username" type="email" name="username"
               placeholder="Enter your registered email"
               autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" type="password" name="password"
               placeholder="Enter your password"
               autocomplete="current-password" required>

        <button class="btn" type="submit">Login</button>
    </form>

    <div class="links">
        Don't have an account?
        <a th:href="@{/register}">Register</a>
        <br>
        <a th:href="@{/}">Back to Home</a>
    </div>
</div>

</body>
</html>
