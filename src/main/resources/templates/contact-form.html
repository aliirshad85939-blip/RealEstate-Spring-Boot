<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Owner | RealEstate</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fa;
            color: #222;
        }

        nav {
            background: #123456;
            color: white;
            padding: 18px 8%;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 22px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            color: #123456;
        }

        .property-info {
            background: #eef4fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 24px;
        }

        .property-info p {
            margin: 6px 0;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd3dc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus, textarea:focus {
            outline: 2px solid #9bc5ef;
            border-color: #2468a2;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            background: #123456;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #205783;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #123456;
            text-decoration: none;
        }

        @media (max-width: 700px) {
            .container {
                margin: 20px 12px;
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<nav>
    <a th:href="@{/}">RealEstate</a>
</nav>

<div class="container">

    <h1>Contact Property Owner</h1>
    <p>Fill in your details and send your enquiry.</p>

    <div class="property-info">
        <p>
            <strong>Property:</strong>
            <span th:text="${property.title}">Property Title</span>
        </p>

        <p>
            <strong>Location:</strong>
            <span th:text="${property.location}">Property Location</span>
        </p>

        <p>
            <strong>Price:</strong>
            ₹<span th:text="${property.price}">0</span>
        </p>
    </div>

    <form th:action="@{/property/{id}/enquiry(id=${property.id})}"
          method="post">

        <label for="name">Full Name</label>
        <input type="text"
               id="name"
               name="name"
               placeholder="Enter your full name"
               maxlength="100"
               required>

        <label for="email">Email Address</label>
        <input type="email"
               id="email"
               name="email"
               placeholder="Enter your email"
               maxlength="150"
               required>

        <label for="phone">Mobile Number</label>
        <input type="tel"
               id="phone"
               name="phone"
               placeholder="Enter your mobile number"
               maxlength="20"
               required>

        <label for="message">Your Message</label>
        <textarea id="message"
                  name="message"
                  placeholder="I am interested in this property..."
                  maxlength="2000"
                  required></textarea>

        <button type="submit">Submit Enquiry</button>

    </form>

    <a class="back-link"
       th:href="@{/property/{id}(id=${property.id})}">
        ← Back to Property Details
    </a>

</div>

</body>
</html>
